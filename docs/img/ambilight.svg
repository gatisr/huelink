<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A television on a dark wall. The light strip behind it glows along the top and both sides in the colours of the picture's edges.">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0e14"/>
      <stop offset="1" stop-color="#12141b"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#3b2fb8"/>
      <stop offset="0.3" stop-color="#b32fa0"/>
      <stop offset="0.55" stop-color="#ff5a3c"/>
      <stop offset="0.8" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ffe27a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14306e"/>
      <stop offset="0.55" stop-color="#1c7f8f"/>
      <stop offset="1" stop-color="#2fb87a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.6" stop-color="#ffd35a"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-80%" width="200%" height="260%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="400"/>
    </clipPath>
    <!-- The strip runs up one side, across the top and down the other: nothing lights the wall below the screen. -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="262" x2="0" y2="336">
      <stop offset="0" stop-color="#11131a" stop-opacity="0"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="352" y="64" width="496" height="264" rx="4"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" fill="url(#wall)"/>

  <!-- The strip's seven segments, each showing the picture edge next to it. -->
  <g clip-path="url(#frame)">
  <g filter="url(#glow)" opacity="0.95">
    <ellipse cx="335" cy="235" rx="120" ry="80" fill="#17408f"/>
    <ellipse cx="335" cy="120" rx="120" ry="80" fill="#4631c9"/>
    <ellipse cx="450" cy="52" rx="120" ry="70" fill="#a52fae"/>
    <ellipse cx="600" cy="48" rx="120" ry="70" fill="#f0503c"/>
    <ellipse cx="750" cy="52" rx="120" ry="70" fill="#ffa42e"/>
    <ellipse cx="865" cy="120" rx="120" ry="80" fill="#ffd966"/>
    <ellipse cx="865" cy="235" rx="120" ry="80" fill="#2fb87a"/>
  </g>
  </g>
  <!-- A plain overlay rather than a mask: masks over a blurred group render differently between viewers. -->
  <rect x="0" y="262" width="1200" height="138" fill="url(#fade)"/>

  <!-- Television -->
  <rect x="344" y="56" width="512" height="280" rx="8" fill="#05060a"/>
  <g clip-path="url(#screen)">
    <rect x="352" y="64" width="496" height="264" fill="url(#sky)"/>
    <circle cx="740" cy="196" r="74" fill="url(#sun)"/>
    <path d="M352 236 L470 150 L560 214 L640 168 L730 236 Z" fill="#2a1a5e" opacity="0.85"/>
    <rect x="352" y="236" width="496" height="92" fill="url(#sea)"/>
    <rect x="690" y="244" width="100" height="5" rx="2.5" fill="#ffe9a8" opacity="0.7"/>
    <rect x="710" y="262" width="60" height="4" rx="2" fill="#ffe9a8" opacity="0.45"/>
  </g>
  <rect x="352" y="64" width="496" height="264" rx="4" fill="none" stroke="#000" stroke-opacity="0.5"/>

  <!-- Console -->
  <rect x="270" y="356" width="660" height="10" rx="5" fill="#1b1e27"/>
  <rect x="270" y="366" width="660" height="34" fill="#0e1016"/>
  <rect x="560" y="336" width="80" height="20" fill="#0a0b10"/>
</svg>
